<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Reservierung bestätigen</title>
    <script src="config.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; }
        .btn-box { margin-top: 20px; }
        button { padding: 15px 30px; font-size: 18px; margin: 10px; cursor: pointer; border-radius: 5px; border: none; }
        #status { margin-top: 30px; font-weight: bold; color: #333; }
    </style>
</head>
<body>
    <h1>Reservierungs-Anfrage</h1>
    <p>Bitte bestätige deine Auswahl:</p>
    
    <div class="btn-box">
        <button style="background-color: #28a745; color: white;" onclick="updateStatus('Genehmigt')">Genehmigen</button>
        <button style="background-color: #dc3545; color: white;" onclick="updateStatus('Abgelehnt')">Ablehnen</button>
    </div>

    <div id="status"></div>

    <script>
        function updateStatus(action) {
            const params = new URLSearchParams(window.location.search);
            const row = params.get('row');
            const statusDiv = document.getElementById('status');
            
            statusDiv.innerText = "Verarbeite Anfrage...";

            // 2. URL aus der zentralen config.js holen
            const url = CONFIG.BASE_URL;
            
            // Aufruf via GET (wie in deinem Code.gs vorgesehen)
            fetch(`${url}?row=${row}&action=${action}`, { 
                method: 'GET',
                mode: 'no-cors' 
            })
            .then(() => {
                statusDiv.innerHTML = "✅ Anfrage wurde gesendet.<br>Bitte prüfe dein Sheet oder schließe das Fenster.";
            })
            .catch(err => {
                console.error(err);
                statusDiv.innerText = "Fehler: Bitte Internetverbindung prüfen.";
                statusDiv.style.color = "red";
            });
        }
    </script>
</body>
</html>
