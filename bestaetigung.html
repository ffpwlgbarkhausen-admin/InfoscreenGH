<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Reservierung bestätigen</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; }
        button { padding: 15px 30px; font-size: 18px; margin: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Reservierungs-Anfrage</h1>
    <p>Bitte wähle eine Aktion aus:</p>
    
    <button onclick="updateStatus('Genehmigt')">Genehmigen</button>
    <button onclick="updateStatus('Abgelehnt')">Ablehnen</button>

    <p id="meldung"></p>

    <script>
        function updateStatus(action) {
            const params = new URLSearchParams(window.location.search);
            const row = params.get('row');
            const meldung = document.getElementById('meldung');
            
            meldung.innerText = "Verarbeite...";

            // HIER DEINE EIGENE SCRIPT-URL EINFÜGEN (die ohne Header!)
            const url = "https://script.google.com/macros/s/AKfycbxG1DF4J8Yz-vcwT0dF7lnSrXxCbC1RRRp7aQWMA7GI3VJQ_7VUrGdBSKY4Y1JqfY_s/exec";
            
            fetch(`${url}?row=${row}&action=${action}`, { method: 'GET' })
                .then(response => response.text())
                .then(data => {
                    meldung.innerHTML = "<strong>Status erfolgreich auf '" + action + "' gesetzt.</strong>";
                })
                .catch(err => {
                    meldung.innerText = "Fehler: " + err;
                });
        }
    </script>
</body>
</html>
