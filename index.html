<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Feuerwehr Barkhausen - Infoscreen</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');
        
        :root {
            --bg-color: #f4f4f4; --card-bg: #ffffff; --text-main: #333; --header-bg: #ffffff;
            --border-color: #e0e0e0; --accent-color: #012796;
        }

        [data-theme="dark"] {
            --bg-color: #121212; --card-bg: #1e1e1e; --text-main: #e0e0e0; --header-bg: #1e1e1e; --border-color: #333;
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* HEADER */
        .header-container {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; background: var(--header-bg); border-bottom: 2px solid var(--border-color);
            height: 90px; flex-shrink: 0; z-index: 1000;
        }
        .header-left img { height: 70px; cursor: pointer; }
        .header-center { flex: 1; text-align: center; color: #B40404; font-weight: bold; font-size: 18px; }
        .header-right { flex: 0 0 180px; display: flex; align-items: center; justify-content: flex-end; gap: 15px; }

        #uhr-display { text-align: right; line-height: 1.1; }
        #uhrzeit { font-size: 1.8rem; font-weight: bold; color: #B40404; font-family: monospace; }
        #datum-header { font-size: 0.75rem; color: #888; font-weight: bold; display: block; }
        
        .menu-trigger { font-size: 32px; cursor: pointer; color: var(--accent-color); padding: 5px; }

        /* KIOSK LINKS - Nur Desktop/Kiosk sichtbar */
        .kiosk-links {
            display: flex; gap: 15px; padding: 10px 20px; background: var(--card-bg);
            border-bottom: 1px solid var(--border-color); justify-content: center;
        }
        .kiosk-btn {
            padding: 8px 16px; background: var(--accent-color); color: white;
            text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 0.9rem;
            transition: opacity 0.2s;
        }
        .kiosk-btn:hover { opacity: 0.8; }

        /* SIDEBAR */
        .sidebar {
            position: fixed; top: 0; right: -360px; width: 280px; height: 100%;
            background: var(--header-bg); box-shadow: -5px 0 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease-in-out; z-index: 3000; padding: 25px; visibility: hidden;
        }
        .sidebar.open { right: 0; visibility: visible; }
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 2500; }

        /* CONTENT */
        .content-container { display: flex; flex-grow: 1; padding: 20px; gap: 20px; overflow: hidden; }
        .content-box { 
            background: var(--card-bg); border-radius: 12px; padding: 0 20px 20px 20px; 
            display: flex; flex-direction: column; flex: 1; overflow-y: auto; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); position: relative; scroll-behavior: smooth;
        }

        .content-box h2 {
            position: sticky; top: 0; background: var(--card-bg); margin: 0;
            height: 70px; line-height: 70px; z-index: 10; text-align: center; color: var(--accent-color);
            border-bottom: 1px solid var(--border-color);
        }
        
        /* MOBILE NAV - Standardzustand (auf Desktop unsichtbar) */
.mobile-nav { 
    display: none; 
    height: 70px; 
    flex-shrink: 0;
    background: var(--header-bg); 
    border-top: 2px solid var(--border-color);
    flex-direction: row; 
}

.nav-item { 
    flex: 1; 
    height: 100%; 
    display: flex; 
    flex-direction: column; 
    justify-content: center; 
    align-items: center; 
    color: #888; 
    cursor: pointer; 
    font-weight: bold; 
    font-size: 0.75rem; 
    text-align: center;
}

.nav-item.active { 
    color: #B40404; 
    background: rgba(180, 4, 4, 0.05); 
}

/* RESPONSIVE DESIGN */
@media (max-width: 800px) {
    .kiosk-links { display: none !important; } 
    .header-container { height: 70px; padding: 0 10px; }
    .header-left img { height: 45px; }
    .header-center { font-size: 14px; }
    .header-right { flex: 0 0 50px; }
    #uhr-display { display: none; }
    
    /* Mobil: Navigation und aktive Tabs einblenden */
    .mobile-nav { display: flex !important; }
    .content-box { display: none; }
    .active-tab { display: flex !important; width: 100% !important; }
    .content-container { padding: 10px; }
}

.blink { animation: blinker 1s linear infinite; }
@keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div id="overlay" class="overlay" onclick="toggleMenu()"></div>
    <div id="sidebar" class="sidebar">
    <h2 style="border:none; position:static; height:auto; line-height:normal; padding:0; margin-bottom:20px;">Menü</h2>
    
    <button onclick="setTheme('light')" style="width:100%; padding:12px; margin-bottom:10px; cursor:pointer;">☀️ Hell</button>
    <button onclick="setTheme('dark')" style="width:100%; padding:12px; margin-bottom:10px; cursor:pointer;">🌙 Dunkel</button>
    <button onclick="setTheme('system')" style="width:100%; padding:12px; margin-bottom:25px; cursor:pointer;">🖥️ System</button>
    
    <hr style="border: 0; border-top: 1px solid #ddd; margin-bottom: 20px;">

    <button onclick="openAdmin()" 
        style="width:100%; padding:12px; margin-bottom:25px; cursor:pointer; background:#f0f0f0; border:1px solid #ccc; font-weight:bold;">
    ⚙️ Adminbereich
</button>

    <button onclick="toggleMenu()" style="width:100%; padding:12px; background:#B40404; color:white; border:none; border-radius:8px; cursor:pointer; font-weight:bold;">Schließen</button>
</div>

    <div class="header-container" onclick="location.reload()" style="cursor: pointer;">
        <div class="header-left"><img src="Logo-redesign-LG13-removebg-preview.png" onclick="manualRefresh()" alt="Logo"></div>
        <div class="header-center">Löschgruppenführung Barkhausen</div>
        <div class="header-right">
            <div id="uhr-display">
                <span id="datum-header">05.03.2026</span>
                <span id="uhrzeit">14:42</span>
            </div>
            <div class="menu-trigger" onclick="toggleMenu(event)">☰</div>
        </div>
    </div>

    <div class="kiosk-links">
        <a href="DEIN_LINK_ZUM_EINSATZNACHWEIS" target="_blank" class="kiosk-btn">📋 Einsatznachweise</a>
        <a href="DEIN_LINK_2" target="_blank" class="kiosk-btn">📁 Dokumente</a>
        <a href="DEIN_LINK_3" target="_blank" class="kiosk-btn">🚒 Fahrzeugstatus</a>
    </div>

    <div class="content-container" id="swipeArea">
        <div id="tab-news" class="content-box active-tab">
            <h2>📢 Aktuelles</h2>
            <div id="news-container">Lade...</div>
        </div>
        <div id="tab-dienst" class="content-box">
            <h2>📅 Dienstplan</h2>
            <div id="dienst-container">Lade...</div>
        </div>
        <div id="tab-formular" class="content-box">
    <h2>📝 Reservierung</h2>
    <form id="res-form" style="display:flex; flex-direction:column; gap:15px; padding:20px;">
        <input type="text" id="res-name" placeholder="Name" required style="padding:10px; border-radius:8px; border:1px solid var(--border-color);">
        <select id="res-objekt" style="padding:10px; border-radius:8px; border:1px solid var(--border-color);">
            <option value="Schulungsraum">Schulungsraum</option>
            <option value="13LF20">13LF20</option>
            <option value="MTW13">MTW13</option>
        </select>
        <input type="text" id="res-grund" placeholder="Grund" required style="padding:10px; border-radius:8px; border:1px solid var(--border-color);">
        <label style="font-size:0.8rem">Von:</label>
        <input type="datetime-local" id="res-start" required style="padding:10px; border-radius:8px; border:1px solid var(--border-color);">
        <label style="font-size:0.8rem">Bis:</label>
        <input type="datetime-local" id="res-ende" required style="padding:10px; border-radius:8px; border:1px solid var(--border-color);">
        <input type="email" id="res-mail" placeholder="E-Mail für Rückmeldung" required style="padding:10px; border-radius:8px; border:1px solid var(--border-color);">
        <button type="submit" style="padding:15px; background:#B40404; color:white; border:none; border-radius:8px; cursor:pointer; font-weight:bold;">Antrag absenden</button>
    </form>
            <div style="margin-top: 30px; padding: 20px;">
    <h3>Aktuelle Belegungen</h3>
    <table id="res-liste" style="width:100%; border-collapse:collapse; font-size:0.9rem;">
        <thead>
            <tr style="border-bottom: 2px solid var(--border-color);">
                <th style="text-align:left; padding:10px;">Objekt</th>
                <th style="text-align:left; padding:10px;">Datum</th>
                <th style="text-align:left; padding:10px;">Status</th>
            </tr>
        </thead>
        <tbody id="res-body">
            </tbody>
    </table>
</div>
</div>
    </div>
 
    <div class="mobile-nav">
        <div class="nav-item active" id="m-news" onclick="showTab('news')">📢 Aktuelles</div>
        <div id="m-dienst" class="nav-item" onclick="showTab('dienst')">📅 Dienstplan</div>
        <div id="m-formular" class="nav-item" onclick="showTab('formular')">📝 Reservieren</div>
    </div>
 
    <script>
        // Zentral definierte Basis-URL für alle Aufrufe
    const BASE_URL = "https://script.google.com/macros/s/AKfycbwX2b-JeXWIXEpT4gzgvnUx53LY-Xn7e9i4oAeTYL4HLE20tNpWOd9_KisM52Qqc8B1/exec";
    const API_URL = BASE_URL + "?page=data";

    // Funktion für den Admin-Button (wird im HTML aufgerufen)
    function openAdmin() {
    // Wir rufen direkt die Seite auf GitHub auf, nicht über das Google Script
    const githubAdminUrl = "https://ffpwlgbarkhausen-admin.github.io/InfoscreenGH/admin.html";
    window.open(githubAdminUrl, '_blank');
}
    async function loadAdminData() {
    try {
        // Wir fragen das Backend explizit nach den Admin-Daten
        const response = await fetch(BASE_URL + "?page=adminData");
        const data = await response.json();
        
        console.log("Daten geladen:", data);
        renderAdminTable(data.reservierungen);
    } catch (error) {
        console.error("Fehler beim Laden der Admin-Daten:", error);
        alert("Daten konnten nicht geladen werden. Bitte Internetverbindung prüfen.");
    }
}

function renderAdminTable(res) {
    const body = document.getElementById('res-body');
    body.innerHTML = res.map(r => `
        <tr>
            <td>${r.objekt}</td>
            <td>${r.name}</td>
            <td>${r.start}</td>
            <td>${r.status}</td>
        </tr>
    `).join('');
}

// Beim Laden der Seite direkt Daten holen
window.onload = loadAdminData;
        
    function updateTime() {
        const jetzt = new Date();
        document.getElementById("uhrzeit").innerHTML = `${String(jetzt.getHours()).padStart(2, '0')}<span class="blink">:</span>${String(jetzt.getMinutes()).padStart(2, '0')}`;
        document.getElementById("datum-header").innerHTML = jetzt.toLocaleDateString('de-DE');
    }
    
    setInterval(updateTime, 1000);
    setInterval(loadData, 600000); // 10 Min Refresh

        function toggleMenu(event) {
    // Verhindert, dass der Klick das location.reload() des Headers auslöst
    if (event) {
        event.stopPropagation();
    }
    
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const open = sidebar.classList.toggle('open');
    
    overlay.style.display = open ? 'block' : 'none';
}

        function setTheme(t) {
            if(t === 'system') {
                localStorage.removeItem('theme-pref');
                const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.body.setAttribute('data-theme', dark ? 'dark' : 'light');
            } else {
                document.body.setAttribute('data-theme', t);
                localStorage.setItem('theme-pref', t);
            }
            if(document.getElementById('sidebar').classList.contains('open')) toggleMenu();
        }

        function formatUhrzeit(val) {
            if(!val) return "--:--";
            let s = String(val);
            return s.includes('T') ? s.split('T')[1].substring(0, 5) : s.substring(0, 5);
        }

        function showTab(tab) {
    if(window.innerWidth > 800) return;
    // Alle Boxen ausblenden
    document.querySelectorAll('.content-box').forEach(b => b.classList.remove('active-tab'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    
    // Gewählte Box einblenden
    document.getElementById('tab-' + tab).classList.add('active-tab');
    document.getElementById('m-' + tab).classList.add('active');
    if(tab === 'dienst') scrollDienst();
}

        let startX = 0;
// Die Reihenfolge, in der die Tabs beim Wischen erscheinen sollen
const tabs = ['news', 'dienst', 'formular']; 

document.getElementById('swipeArea').addEventListener('touchstart', e => startX = e.touches[0].clientX);

document.getElementById('swipeArea').addEventListener('touchend', e => {
    let diff = startX - e.changedTouches[0].clientX;
    
    // Nur reagieren, wenn die Wischbewegung weit genug war (70 Pixel)
    if (Math.abs(diff) > 70) {
        // 1. Herausfinden, welcher Tab gerade aktiv ist
        const activeNav = document.querySelector('.nav-item.active');
        if (!activeNav) return;
        
        const currentTabId = activeNav.id.replace('m-', '');
        let currentIndex = tabs.indexOf(currentTabId);

        // 2. Logik für das Weiterschalten
        if (diff > 0 && currentIndex < tabs.length - 1) {
            // Nach links wischen -> Zeige den nächsten Tab rechts
            showTab(tabs[currentIndex + 1]);
        } else if (diff < 0 && currentIndex > 0) {
            // Nach rechts wischen -> Zeige den vorherigen Tab links
            showTab(tabs[currentIndex - 1]);
        }
    }
});

        async function loadData() {
    try {
        const res = await fetch(API_URL);
        const data = await res.json();
        renderNews(data.news);
        renderDienst(data.dienste);
        renderReservierungen(data.reservierungen); // <--- HIER MUSS ES REIN!
    } catch (e) { console.error("Fehler beim Laden:", e); }
}

        function renderNews(news) {
    // 1. Sortier-Logik
    const sortedNews = [...news].sort((a, b) => {
        // Hier konsequent alles in Kleinbuchstaben
        const katA = (a.kat || "").toLowerCase();
        const katB = (b.kat || "").toLowerCase();
        
        // Vergleich mit kleingeschriebener Version
        const istWichtigA = (katA === "wichtig!");
        const istWichtigB = (katB === "wichtig!");

        if (istWichtigA && !istWichtigB) return -1;
        if (!istWichtigA && istWichtigB) return 1;
        return 0;
    });

    // 2. Anzeige-Logik
    document.getElementById('news-container').innerHTML = sortedNews.map(n => {
        const kat = (n.kat || "Info");
        const katLower = kat.toLowerCase(); // Alles in Kleinbuchstaben für den Check
        
        let farbe = "#012796"; // Blau für Info
        let blinkClass = "";
        let icon = "";

        // Vergleich mit "wichtig!" (klein)
        if (katLower === "wichtig!") {
            farbe = "#B40404"; // Rot für Wichtig!
            blinkClass = "blink"; 
            icon = "🚨 ";
        }

        return `
            <div style="border-left:8px solid ${farbe}; padding:15px; background:var(--card-bg); margin-top:15px; border-radius:8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                    <h3 style="margin:0; color:${farbe}" class="${blinkClass}">${icon}${n.titel}</h3>
                    <span style="font-size: 0.65rem; font-weight: bold; text-transform: uppercase; opacity: 0.6; background: #eee; padding: 2px 5px; border-radius: 4px;">${kat}</span>
                </div>
                <p style="margin:8px 0 0 0; line-height: 1.4;">${n.inhalt}</p>
            </div>`;
    }).join('');
}
        function renderDienst(dienste) {
    const heute = new Date(); 
    heute.setHours(0,0,0,0);
    let nextFound = false;
    let html = `<table style="width:100%; border-collapse:collapse;">`;
    
    dienste.forEach(d => {
        const dObj = new Date(d.datum);
        const isNext = (!nextFound && dObj >= heute);
        if(isNext) nextFound = true;
        
        // --- ZEITKORREKTUR START ---
        let timeStr = formatUhrzeit(d.uhrzeit);
        if (timeStr !== "--:--" && timeStr.includes(':')) {
            let parts = timeStr.split(':');
            let stunden = parseInt(parts[0], 10);
            let minuten = parts[1];
            
            // Eine Stunde addieren (24h Modulo sorgt dafür, dass aus 23:00 -> 00:00 wird)
            stunden = (stunden + 1) % 24;
            timeStr = String(stunden).padStart(2, '0') + ":" + minuten;
        }
        // --- ZEITKORREKTUR ENDE ---

        const dateStr = dObj.toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit', year:'2-digit'});
        
        html += `<tr ${isNext ? 'id="next-row" style="background:rgba(255,214,0,0.15); border-left:5px solid #FFD600"' : ''} style="border-bottom:1px solid var(--border-color)">
            <td style="padding:15px; font-weight:bold; color:#B40404; white-space:nowrap;">${dateStr}<br><span style="color:var(--text-main); font-size:0.8rem">${timeStr} Uhr</span></td>
            <td style="padding:15px">
                <strong>${d.thema}</strong><br>
                <small style="color:var(--text-main); opacity: 0.9;">
                    ${d.kleidung ? `<span style="color:#B40404; font-weight:bold;">👕 ${d.kleidung}</span>` : ''}
                    ${d.kleidung && d.leitung ? ' | ' : ''}
                    <span>${d.leitung}</span>
                </small>
            </td>
        </tr>`;
    });
    document.getElementById('dienst-container').innerHTML = html + "</table>";
    scrollDienst();
}
        function renderReservierungen(res) {
    const body = document.getElementById('res-body');
    body.innerHTML = res.map(r => `
        <tr style="border-bottom: 1px solid var(--border-color);">
            <td style="padding:10px;">
                <div style="font-weight: bold;">${r.objekt}</div>
                <div style="font-size: 0.75rem; color: #666;">${r.name || ''}</div>
            </td>
            <td style="padding:10px;">${r.start.substring(8, 10)}.${r.start.substring(5, 7)}.</td>
            <td style="padding:10px;">
                <span style="padding:4px 8px; border-radius:4px; font-size:0.75rem; 
                    ${r.status === 'Genehmigt' ? 'background:#d4edda; color:#155724;' : 
                      r.status === 'Abgelehnt' ? 'background:#f8d7da; color:#721c24;' : 
                      'background:#fff3cd; color:#856404;'}">
                    ${r.status}
                </span>
            </td>
        </tr>
    `).join('');
}
        
        function scrollDienst() {
            setTimeout(() => {
                const container = document.getElementById('tab-dienst');
                const row = document.getElementById('next-row');
                if(row && container) {
                    // Erhöhter Offset (120px) für Kiosk-Buttons + Sticky Header
                    const offset = window.innerWidth > 800 ? 120 : 70;
                    const rowPos = row.offsetTop - offset;
                    container.scrollTo({ top: rowPos, behavior: 'smooth' });
                }
            }, 600);
        }

        async function manualRefresh() { await loadData(); }

        window.onload = () => {
            updateTime();
            loadData();
            const saved = localStorage.getItem('theme-pref');
            if(saved) setTheme(saved); else setTheme('system');
        };

       document.getElementById('res-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    // Visuelles Feedback für den Nutzer
    const submitBtn = e.target.querySelector('button');
    const originalText = submitBtn.innerText;
    submitBtn.disabled = true;
    submitBtn.innerText = "Wird gesendet...";

    const formData = {
        name: document.getElementById('res-name').value,
        objekt: document.getElementById('res-objekt').value,
        grund: document.getElementById('res-grund').value,
        start: document.getElementById('res-start').value,
        ende: document.getElementById('res-ende').value,
        mail: document.getElementById('res-mail').value
    };

    try {
        // 'no-cors' erlaubt das Senden der Daten, auch wenn Google 
        // den Header nicht perfekt zurückgibt.
        await fetch(API_URL, {
            method: 'POST',
            mode: 'no-cors', 
            cache: 'no-cache',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(formData)
        });

        // Da wir bei 'no-cors' keine Antwort lesen können, 
        // gehen wir davon aus, dass es geklappt hat, wenn kein Fehler auftritt.
        alert("Antrag wurde erfolgreich abgesendet!");
        document.getElementById('res-form').reset();

    } catch (error) {
        console.error("Fehler:", error);
        alert("Senden fehlgeschlagen. Bitte Internetverbindung prüfen.");
    } finally {
        // Button wieder bereit machen
        submitBtn.disabled = false;
        submitBtn.innerText = originalText;
    }
});

        // --- NEU: PULL-TO-REFRESH ---
let touchStartY = 0;

document.getElementById('swipeArea').addEventListener('touchstart', e => {
    touchStartY = e.touches[0].clientY;
});

document.getElementById('swipeArea').addEventListener('touchend', e => {
    let diffY = e.changedTouches[0].clientY - touchStartY;
    
    // Wenn man mehr als 150px nach unten wischt, Seite neu laden
    if (diffY > 150) {
        location.reload();
    }
});
    </script>
</body>
</html>
