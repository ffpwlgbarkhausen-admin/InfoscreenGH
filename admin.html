<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin-Panel Barkhausen</title>
    <script src="config.js"></script>
    <style>
        /* ... Dein CSS bleibt gleich ... */
    </style>
</head>
<body>

<div class="container">
    <h1>Verwaltung Barkhausen</h1>
    <div id="admin-res-list" class="loader">Lade Anfragen...</div>
</div>

<script>
    // Die URL kommt nun aus der config.js
    const URL = CONFIG.BASE_URL;

    window.onload = refreshData;

    async function refreshData() {
        // GET-Request an dein Google-Backend
        const res = await fetch(URL + "?page=adminData");
        const data = await res.json();
        displayAdminData(data);
    }

    function displayAdminData(data) {
        const resContainer = document.getElementById('admin-res-list');
        const offene = data.reservierungen.filter(r => r.status === 'Offen');
        
        if (offene.length === 0) {
            resContainer.innerHTML = "<p style='color:green;'>Alles erledigt!</p>";
        } else {
            resContainer.innerHTML = offene.map((r, i) => `
                <div class="list-item">
                    <strong>${r.name}</strong> (${r.objekt})<br>
                    <button class="btn-approve" onclick="updateRes(${i}, 'Genehmigt')">✔ Genehmigen</button>
                    <button class="btn-reject" onclick="updateRes(${i}, 'Abgelehnt')">✖ Ablehnen</button>
                </div>
            `).join('');
        }
    }

    async function updateRes(idx, status) {
        // POST-Request zum Backend senden
        await fetch(URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ action: 'update', row: idx, status: status })
        });
        alert("Status aktualisiert");
        refreshData();
    }
    
    async function saveNews() {
    const data = {
        action: "addNews", // <--- WICHTIG: Das steuert dein doPost!
        titel: document.getElementById('news-titel').value,
        inhalt: document.getElementById('news-inhalt').value,
        kat: document.getElementById('news-kat').value
    };
    
    await fetch(CONFIG.BASE_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    });
    alert("News gespeichert!");
    refreshData();
}
</script>
</body>
</html>
