<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin-Panel Barkhausen</title>
    <script src="config.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');
        
        body { font-family: 'Montserrat', sans-serif; background: #f4f4f4; margin: 0; padding: 0; color: #333; overflow-x: hidden; }
        
        /* HEADER */
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 10px 15px; background: white; border-bottom: 2px solid #012796; 
        }
        
        /* SIDEBAR / MENÜ (Übernommen) */
        .sidebar {
            position: fixed; top: 0; right: -360px; width: 280px; height: 100%;
            background: white; box-shadow: -5px 0 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease-in-out; z-index: 3000; padding: 25px; visibility: hidden;
        }
        .sidebar.open { right: 0; visibility: visible; }
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 2500; }

        /* GRID */
        .container { 
            padding: 20px; max-width: 1400px; margin: auto; 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); 
            gap: 20px; 
        }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }

        #admin-res-list, #admin-news-list { max-height: 450px; overflow-y: auto; }
        .list-item { border-bottom: 1px solid #eee; padding: 12px 0; }
        
        input, select, textarea { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        button { cursor: pointer; padding: 10px 15px; border: none; border-radius: 6px; background: #012796; color: white; margin-top: 5px; }
        .btn-del { background: #B40404; }

        @media (max-width: 480px) { .container { padding: 10px; gap: 10px; } }
    </style>
</head>
<body>

<div id="overlay" class="overlay" onclick="toggleMenu()"></div>
<div id="sidebar" class="sidebar">
    <h2 style="margin-top:0;">Menü</h2>
    <button onclick="window.location.href='index.html'" style="width:100%; padding:12px; margin-bottom:10px;">⬅️ Zur Info-Seite</button>
    <button onclick="toggleMenu()" style="width:100%; padding:12px; background:#B40404; color:white; border:none; border-radius:8px;">Schließen</button>
</div>

<header>
    <div style="display: flex; align-items: center;">
        <img src="https://raw.githubusercontent.com/ffpwlgbarkhausen-admin/InfoscreenGH/main/Logo-redesign-LG13-removebg-preview.png" style="height: 50px; margin-right: 15px;">
        <h2 style="margin:0; font-size: 1.2rem;">Löschgruppe Barkhausen</h2>
    </div>
    <div style="font-size: 28px; cursor:pointer; color: #012796;" onclick="toggleMenu()">☰</div>
</header>

<div class="container">
    <h1 style="grid-column: 1 / -1; margin: 10px 0;">⚙️ Admin-Bereich</h1>

    <div class="card">
        <h2>📢 Neue News veröffentlichen</h2>
        <input type="text" id="news-titel" placeholder="Titel der News">
        <textarea id="news-inhalt" placeholder="Inhalt"></textarea>
        <select id="news-kat"><option value="Info">Info</option><option value="Wichtig!">Wichtig!</option></select>
        <input type="text" id="news-foto" placeholder="Dateiname (z.B. bilder/test.jpg)">
        <button onclick="saveNews()">News speichern</button>
    </div>

    <div class="card">
        <h2>📅 Offene Reservierungen</h2>
        <div id="admin-res-list">Lade Reservierungen...</div>
    </div>

    <div class="card">
        <h2>📰 Bestehende News</h2>
        <div id="admin-news-list">Lade News...</div>
    </div>
</div>

<script>
    const URL = CONFIG.BASE_URL;
    window.onload = refreshData;

    function toggleMenu() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const open = sidebar.classList.toggle('open');
        overlay.style.display = open ? 'block' : 'none';
    }

    async function refreshData() {
        try {
            const res = await fetch(URL + "?page=adminData");
            const data = await res.json();
            displayAdminData(data);
        } catch (e) { console.error("Fehler beim Laden:", e); }
    }

    function displayAdminData(data) {
        const resContainer = document.getElementById('admin-res-list');
        const offene = data.reservierungen.filter(r => r.status === 'Offen');
        resContainer.innerHTML = offene.length === 0 ? "<p>Alles erledigt!</p>" : 
            offene.map((r, i) => `
                <div class="list-item">
                    <strong>${r.name}</strong> (${r.objekt})<br>
                    <button onclick="updateRes(${i}, 'Genehmigt')" style="padding: 5px 10px; font-size: 0.8rem;">✔ OK</button>
                    <button onclick="updateRes(${i}, 'Abgelehnt')" class="btn-del" style="padding: 5px 10px; font-size: 0.8rem;">✖ Nein</button>
                </div>
            `).join('');

        const newsContainer = document.getElementById('admin-news-list');
        newsContainer.innerHTML = data.news.map((n, i) => `
            <div class="list-item">
                <strong>${n.titel}</strong> ${n.foto ? '📷' : ''}<br>
                <small>${n.inhalt}</small><br>
                <button onclick="deleteNews(${i})" class="btn-del" style="padding: 5px 10px; font-size: 0.8rem;">🗑️ Löschen</button>
            </div>
        `).join('');
    }

    async function saveNews() {
        const GITHUB_BASE = "https://raw.githubusercontent.com/ffpwlgbarkhausen-admin/InfoscreenGH/main/";
        const fileName = document.getElementById('news-foto').value.trim();
        const fullUrl = fileName ? GITHUB_BASE + fileName : "";

        const data = {
            action: "addNews",
            titel: document.getElementById('news-titel').value,
            inhalt: document.getElementById('news-inhalt').value,
            kat: document.getElementById('news-kat').value,
            foto: fullUrl 
        };
        
        await fetch(URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
        alert("News gespeichert!");
        refreshData();
    }

    async function updateRes(idx, status) {
        await fetch(URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'updateRes', row: idx, status: status }) });
        refreshData();
    }

    async function deleteNews(idx) {
        await fetch(URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'deleteNews', index: idx }) });
        refreshData();
    }
</script>
</body>
</html>
