<!DOCTYPE html>
<html>
<head>
    <script src="config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin-Panel Barkhausen</title>
    <style>
        :root {
            --primary: #B40404;
            --bg: #f4f4f9;
            --card: #ffffff;
            --text: #333;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--text); }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { color: var(--primary); border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-bottom: 30px; }
        h2 { margin-top: 10px; font-size: 1.2rem; color: #555; }
        
        /* Karten-Design */
        .card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 25px; }
        
        /* Formulare */
        input, textarea, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 1rem; margin-top: 10px; }
        
        .btn-save { background: var(--primary); color: white; }
        .btn-save:hover { background: #8e0303; }
        
        .btn-approve { background: #28a745; color: white; width: 48%; margin-right: 2%; }
        .btn-reject { background: #dc3545; color: white; width: 48%; }
        .btn-delete { width: auto; background: #ff4444; color: white; padding: 5px 12px; margin: 0; font-size: 0.8rem; }

        /* Listen-Elemente */
        .list-item { border-left: 4px solid var(--primary); padding: 15px; background: #fafafa; margin-bottom: 10px; border-radius: 4px; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .status-tag { font-size: 0.7rem; padding: 3px 6px; border-radius: 4px; text-transform: uppercase; font-weight: bold; background: #eee; }
        
        .loader { text-align: center; color: #888; font-style: italic; padding: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Verwaltung Barkhausen</h1>

    <div class="card">
        <h2>📢 Neue Nachricht einstellen</h2>
        <input type="text" id="news-titel" placeholder="Titel der Nachricht">
        <textarea id="news-inhalt" rows="3" placeholder="Inhalt der Nachricht..."></textarea>
        <select id="news-kat">
            <option value="info">Info (Blau)</option>
            <option value="wichtig">Wichtig (Gelb/Blinkend)</option>
            <option value="alarm">Einsatz (Rot)</option>
        </select>
        <button class="btn-save" onclick="saveNews()">Nachricht veröffentlichen</button>
    </div>

    <div class="card">
        <h2>📅 Offene Reservierungen</h2>
        <div id="admin-res-list" class="loader">Lade Anfragen...</div>
    </div>

    <div class="card">
        <h2>📝 Aktuelle News (Löschen möglich)</h2>
        <div id="admin-news-list" class="loader">Lade News-Übersicht...</div>
    </div>
</div>

<script>
    window.onload = function() {
        refreshData();
    };

    function refreshData() {
        google.script.run.withSuccessHandler(displayAdminData).getJsonDataForAdmin();
    }

    function displayAdminData(jsonString) {
        const data = JSON.parse(jsonString);
        
        // 1. Reservierungen rendern (Filter auf "Offen")
        const resContainer = document.getElementById('admin-res-list');
        const offene = data.reservierungen.filter(r => r.status === 'Offen');
        
        if (offene.length === 0) {
            resContainer.innerHTML = "<p style='color:green;'>Alles erledigt! Keine offenen Anfragen.</p>";
        } else {
            resContainer.innerHTML = offene.map((r, i) => `
                <div class="list-item">
                    <strong>${r.name}</strong> möchte: <strong>${r.objekt}</strong><br>
                    <small>${r.start} bis ${r.ende}</small><br>
                    <div style="margin-top:10px; display: flex;">
                        <button class="btn-approve" onclick="updateRes(${i}, 'Genehmigt')">✔ Genehmigen</button>
                        <button class="btn-reject" onclick="updateRes(${i}, 'Abgelehnt')">✖ Ablehnen</button>
                    </div>
                </div>
            `).join('');
        }

        // 2. News rendern mit Lösch-Funktion (Index-sicher)
        const newsContainer = document.getElementById('admin-news-list');
        if (data.news.length === 0) {
            newsContainer.innerHTML = "Keine News vorhanden.";
        } else {
            // Wir mappen den originalIndex mit, damit das Löschen trotz .reverse() klappt
            newsContainer.innerHTML = data.news.map((n, i) => ({...n, originalIndex: i}))
                .reverse()
                .map(n => `
                    <div class="list-item" style="border-left-color: #ddd;">
                        <div class="flex-between">
                            <div>
                                <strong>${n.titel}</strong> <span class="status-tag">${n.kat}</span><br>
                                <small>${n.inhalt.substring(0, 60)}...</small>
                            </div>
                            <button class="btn-delete" onclick="removeNews(${n.originalIndex})">Löschen</button>
                        </div>
                    </div>
                `).join('');
        }
    }

    function saveNews() {
        const titel = document.getElementById('news-titel').value;
        const inhalt = document.getElementById('news-inhalt').value;
        const kat = document.getElementById('news-kat').value;
        
        if(!titel || !inhalt) return alert("Bitte Titel und Inhalt ausfüllen!");

        google.script.run.withSuccessHandler(() => {
            alert("News erfolgreich gespeichert!");
            document.getElementById('news-titel').value = "";
            document.getElementById('news-inhalt').value = "";
            refreshData();
        }).addNews({titel, inhalt, kat});
    }

    function updateRes(idx, status) {
        google.script.run.withSuccessHandler(() => {
            alert("Reservierung wurde " + status);
            refreshData();
        }).updateReservierungStatus(idx, status);
    }

    function removeNews(idx) {
        if(confirm("Soll diese Nachricht wirklich vom Screen entfernt werden?")) {
            google.script.run.withSuccessHandler(() => {
                refreshData();
            }).deleteNews(idx);
        }
    }
</script>

</body>
</html>
